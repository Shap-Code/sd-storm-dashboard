name: Update storm data
on:
  schedule: [{cron: '*/10 * * * *'}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: data, cancel-in-progress: true}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_data.py
      - run: |
          git config user.name "storm-data-bot"; git config user.email "actions@users.noreply.github.com"
          git add data && (git diff --cached --quiet || (git commit -m "data: $(date -u +%FT%TZ)" && git pull --rebase && git push))
